name: Issue 61 lockfile sync
on:
  push:
    branches: [issue/61-local-settlement-maps]
permissions:
  contents: write
jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue/61-local-settlement-maps
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "[lockfile] Sync Settlemaker dependency"
          git push origin HEAD:issue/61-local-settlement-maps
